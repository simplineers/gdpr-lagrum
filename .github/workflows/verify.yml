name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Ordagrannhetskontroll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Bygg och verifiera
        run: make all

      - name: Kontrollera att lagrum/ och METOD.md ar aktuella
        run: make sync

      - name: Ladda upp samlingsutgavorna
        uses: actions/upload-artifact@v4
        with:
          name: gdpr-lagrum-artefakter
          path: dist/
          if-no-files-found: error
          retention-days: 30
