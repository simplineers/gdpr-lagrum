name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Ordagrannhetskontroll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kontrollera att pinnad kallfil finns
        run: |
          f=source/celex-02016R0679-20160504-sv.html
          if [ ! -f "$f" ]; then
            echo "::error::Pinnad kallfil saknas. Se source/SOURCE.md."
            exit 1
          fi

      - name: Bygg och verifiera
        run: make all

      - name: Ladda upp artefakter
        uses: actions/upload-artifact@v4
        with:
          name: gdpr-lagrum-artefakter
          path: dist/
          if-no-files-found: error
          retention-days: 30
